<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#000"><title>Miraculous — Chapter 1</title><link rel="stylesheet" href="styles.css"></head><body><main class="app-shell"><header class="topbar"><div class="brand">MIRACULOUS</div><div class="top-controls"><button id="sound-toggle" class="icon-button" type="button">🔊</button><button id="settings-toggle" class="icon-button" type="button">⚙</button></div></header><section class="screen game-screen"><aside id="stats-panel" class="stats-panel"><div class="stats-header"><h2>STATUS</h2><button id="close-stats" class="mini-button">×</button></div><div class="player-summary"><span class="avatar-dot"></span><div><strong id="stats-name">Player</strong><span>Level 1</span></div></div><div class="stat-list"><div><span>XP</span><strong>0 / 100</strong></div><div><span>Coins</span><strong>0</strong></div><div><span>Energy</span><strong>100 / 100</strong></div><div><span>Miraculous</span><strong>Undiscovered</strong></div></div></aside><button id="open-stats" class="stats-tab">STATS</button><div class="story-area"><div class="story-meta"><span>CHAPTER 1</span><span>PARIS</span></div><div class="story-log"><p class="story-entry system" id="welcome"></p><p class="story-entry">Your story begins here.</p></div><div class="choices"><button class="choice" type="button">Continue</button></div></div></section></main><script>const data=JSON.parse(sessionStorage.getItem('miraculousCharacter')||'null');if(!data)location.replace('index.html');else document.getElementById('welcome').textContent=`Welcome, ${data.name}.`;document.getElementById('close-stats').onclick=()=>document.getElementById('stats-panel').classList.add('closed');document.getElementById('open-stats').onclick=()=>document.getElementById('stats-panel').classList.remove('closed');document.getElementById('sound-toggle').onclick=e=>e.currentTarget.textContent=e.currentTarget.textContent==='🔊'?'🔇':'🔊';</script></body></html>
